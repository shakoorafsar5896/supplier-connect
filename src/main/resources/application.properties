# Application Info
spring.application.name=SupplierConnect
server.port=8080

# Spring MVC JSP View Resolver Config
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------
# PostgreSQL Database Configuration
# -------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/supplierconnect_db
spring.datasource.username=postgres
spring.datasource.password=ROOT
spring.datasource.driver-class-name=org.postgresql.Driver

# Fallback H2 Database configuration (uncomment if PostgreSQL is not running locally)
# spring.datasource.url=jdbc:h2:mem:supplierconnect_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database Seeding Configuration
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Logging Level
logging.level.org.springframework.security=INFO
logging.level.com.supplierconnect=DEBUG
